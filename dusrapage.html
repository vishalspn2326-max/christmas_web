<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Christmas Gift</title>
    <link rel="stylesheet" href="dusrapage.css">
</head>

<body>
    <div class="bg-overlay"></div>
<div class="snow"></div>

    <div class="wrapper">
        <p class="top-note">a little christmas thought… 🎄</p>

        <h1 class="title">Hey You</h1>

        <div class="card">

            <!-- Right Top Image -->
            <img src="/christmas_web/assests/2img.png" class="decor decor-top-right" alt="decor">

            <!-- Left Bottom Image -->
            <img src="/christmas_web/assests/1img.png" class="decor decor-bottom-left" alt="decor">
            <!-- Window Dots -->
            <div class="window-dots">
                <span></span><span></span><span></span>
            </div>

            <p class="message">
                I wanted to do a tiny something this Christmas,
                because you mean a lot to me.
            </p>

            <p class="tap-text">Tap below, okay?</p>

            <a href="/christmas_web/thirdpage.html">

                <button class="gift-btn">
                    Open Your Gift <span>→</span>
                </button>
            </a>
        </div>

        <!-- Optional decorative images -->
        <img src="cat1.png" class="cat cat-left" alt="">
        <img src="cat2.png" class="cat cat-right" alt="">

        <p class="footer">
            Made with love, lights & warm feelings 🎄 🤍
        </p>
    </div>

</body>

</html>
